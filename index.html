<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>소싱 인박스</title>
<!--
  껍데기 페이지다. 데이터도 키도 없다.
  카드·저장은 전부 ?k= 토큰이 붙은 API 가 한다. 토큰 없이 열면 빈 화면이다.
-->
<style>
:root{--bg:#0f1115;--card:#1a1e26;--line:#2a2f3a;--tx:#e8eaf0;--dim:#8b93a5;
--go:#34c98e;--no:#e05666;--hold:#d9a441;--chip:#242a35}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Malgun Gothic',sans-serif;padding-bottom:40px}
/* 폰·PC·맥북 다 쓴다. 큰 화면에서 한 줄이 너무 길어지지 않게 가운데로 모은다 */
header,main{max-width:760px;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:5}
h1{font-size:17px}#meta{color:var(--dim);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;background:var(--chip);color:var(--dim);font-size:14px;border:1px solid var(--line)}
.tab.on{background:#2b3446;color:var(--tx);border-color:#3d4a63}
.search{width:100%;margin-top:9px;background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:10px 12px;font-size:14px}
.search::placeholder{color:var(--dim)}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;background:var(--chip);color:var(--dim);font-size:12.5px;border:1px solid var(--line)}
.chip.on{background:#2b3446;color:var(--tx);border-color:#3d4a63}
main{padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.kw{font-size:19px;font-weight:800}
.badges{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.b{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--chip);color:var(--dim)}
.b.season{background:#3d3320;color:#e8c15a}
.b.dday{background:#46232a;color:#ff8f9d}
.hook{color:#e8c15a;font-size:14.5px;font-weight:700;margin-bottom:8px;line-height:1.5}
.big{font-size:21px;font-weight:800;margin:4px 0 10px}
.big em{color:var(--go);font-style:normal}
.facts{font-size:14.5px;line-height:1.8;color:#c8d0e0}
.facts em{color:var(--tx);font-weight:700;font-style:normal}
.facts .why{color:#8fd8b8}
.sec{font-size:12.5px;color:var(--dim);margin:14px 0 6px;letter-spacing:.04em}
.comp{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.edge{margin-top:6px;font-size:14px;line-height:1.65}
.edge div{padding:7px 10px;border-radius:9px;margin-bottom:5px;display:flex;gap:7px}
.edge .g{background:#16302a;color:#9fe3c4}
.edge .w{background:#332126;color:#f0a9b4}
.edge b{flex:0 0 auto}
.comp a{color:#7fb2ff;text-decoration:none}
.comp .rev{color:var(--go);font-weight:700}
.star{color:#e8c15a}
.compRest{display:none}
.compRest.show{display:block}
.more{width:100%;margin-top:6px;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--dim);font-size:13px}
.cn{display:flex;gap:6px;flex-wrap:wrap}
.cn span{background:var(--chip);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:14px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;padding:13px 0;border-radius:11px;border:0;font-size:16px;font-weight:700;color:#fff}
.o{background:var(--go)}.x{background:var(--no)}.h{background:var(--hold)}
.reasons{display:none;gap:6px;flex-wrap:wrap;margin-top:10px}
.reasons.show{display:flex}
.reasons button{background:var(--chip);border:1px solid var(--line);color:var(--tx);padding:8px 12px;border-radius:9px;font-size:13px}
.memo{width:100%;margin-top:8px;background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px;font-size:14px}
.linkbox{margin-top:10px}
.linkbox input{width:100%;background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:10px;font-size:13px}
.done .cardBody{opacity:.35;pointer-events:none}
.undoBar{display:none;margin-top:12px}
.done .undoBar{display:block}
.undoBar button{width:100%;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--tx);font-size:14px;font-weight:700}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b3446;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style></head><body>
<header><h1>소싱 인박스</h1><div id="meta"></div>
<div class="tabs">
<div class="tab on" data-t="year">연중</div>
<div class="tab" data-t="season">시즌</div>
<div class="tab" data-t="prog">진행중</div>
</div>
<input id="search" class="search" placeholder="키워드로 찾기">
<div class="chips" id="filters">
<div class="chip on" data-f="all">전체</div>
<div class="chip" data-f="clean">깨끗한 것만</div>
<div class="chip" data-f="good">기회 있음</div>
</div>
</header>
<main id="list"></main>
<div class="toast" id="toast"></div>
<script>
const K=new URLSearchParams(location.search).get("k")||"";
const API="https://pgftsnnvnthpvwuicxpv.supabase.co/functions/v1/kanpick-inbox?k="+encodeURIComponent(K);
const PAGE=30;
// done: keyword → {kw, d, ts}. 예전 형식(문자열 배열, "kw|d" 배열)도 그대로 읽어들인다.
const done=new Map();
(function(){
  let raw=[];
  try{raw=JSON.parse(localStorage.getItem("kanpick_done")||"[]")}catch(e){raw=[]}
  for(const x of raw){
    if(typeof x==="string"){
      const i=x.indexOf("|");
      const kw=i>=0?x.slice(0,i):x, d=i>=0?x.slice(i+1):"?";
      done.set(kw,{kw,d,ts:0});
    }else if(x&&x.kw){done.set(x.kw,x)}
  }
})();
function saveDone(){localStorage.setItem("kanpick_done",JSON.stringify([...done.values()]))}
let DATA=null, TAB="year", Q="", FILTER="all";
let filteredList=[], shown=0, sentinel=null, observer=null;
const W=n=>n>=1e8?(n/1e8).toFixed(1)+"억":n>=1e4?Math.round(n/1e4)+"만":n.toLocaleString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function post(row){
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(row)});
    if(!r.ok)throw 0;return true}
  catch(e){toast("전송 실패 — 나중에 다시");return false}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;
  t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
function copy(s){navigator.clipboard&&navigator.clipboard.writeText(s);toast("복사됨 "+s)}
function updateMeta(){
  if(!DATA)return;
  const remaining=DATA.cards.filter(c=>!done.has(c.keyword)).length;
  const todayStr=new Date().toDateString();
  let oCount=0,xCount=0,hCount=0;
  for(const v of done.values()){
    if(!v.ts||new Date(v.ts).toDateString()!==todayStr)continue;
    if(v.d==="O")oCount++;else if(v.d==="X")xCount++;else if(v.d==="hold")hCount++;
  }
  // 데이터가 며칠 전 것인지 — 4일 넘게 낡았으면 경고를 붙인다
  let age="";
  if(DATA.asof){
    const olds=Object.entries(DATA.asof).map(([k,v])=>{
      const d=Math.round((Date.now()-new Date(v))/864e5);
      return {k,d}}).filter(x=>x.d>=4);
    if(olds.length)age=" · ⚠ "+olds.map(x=>x.k+" 숫자가 "+x.d+"일 전 것").join(", ");
  }
  document.getElementById("meta").textContent=
    DATA.published_at+" 발행 · 남은 "+remaining+" · 오늘 O "+oCount+" · X "+xCount+
    (hCount?" · 보류 "+hCount:"")+age;
}
function decide(kw,d,reason,memo,link,msg){
  post({keyword:kw,decision:d,reason:reason||"",memo:memo||"",link_1688:link||""});
  done.set(kw,{kw,d,ts:Date.now()});saveDone();
  const el=document.querySelector('[data-kw="'+CSS.escape(kw)+'"]');
  if(el)el.classList.add("done");
  updateMeta();
  toast(msg||(d==="O"?"O — 들어간다":d==="X"?"X — 버림":"보류"))}
function undo(kw,card){
  post({keyword:kw,decision:"undo"});
  done.delete(kw);saveDone();
  card.classList.remove("done");
  const r=card.querySelector(".reasons");if(r)r.classList.remove("show");
  updateMeta();
  toast("되돌렸다 — 다시 판단해주세요")}
function onAct(ev){
  const b=ev.target.closest("[data-act]");if(!b)return;
  const card=b.closest(".card"),kw=card.dataset.kw,act=b.dataset.act;
  if(act==="O"){
    const t=card.querySelector(".cn span");
    const term=t?t.dataset.t:"";
    if(term)copy_silent(term);
    decide(kw,"O",null,null,null,
      term?"O — 검색어 복사됨. 1688에서 찾아보고 [진행중] 탭에 링크를 붙여넣으세요":null)}
  else if(act==="hold")decide(kw,"hold");
  else if(act==="x")card.querySelector(".reasons").classList.toggle("show");
  else if(act==="reason")decide(kw,"X",b.dataset.r,card.querySelector(".memo").value);
  else if(act==="copy")copy(b.dataset.t);
  else if(act==="undo")undo(kw,card);
  else if(act==="more"){
    const wrap=b.previousElementSibling;
    const open=wrap.classList.toggle("show");
    b.textContent=open?"접기":"+"+b.dataset.n+"개 더 보기"}}
function copy_silent(s){navigator.clipboard&&navigator.clipboard.writeText(s)}
function onKey(ev){
  if(ev.key!=="Enter")return;
  const i=ev.target.closest(".linkbox input");if(!i||!i.value)return;
  decide(i.closest(".card").dataset.kw,"O","","link",i.value);i.value=""}
function card(c,prog){
  const dead=c.deadline?'<span class="b dday">⏰ '+esc(c.deadline)+' 까지 발주해야 시즌을 잡음</span>':"";
  const sea=(c.season&&c.season!=="연중"&&c.season!=="?")?
    '<span class="b season">'+c.peak_month+'월에 '+Math.round(c.ratio)+'배로 뛰는 '+esc(c.season)+' 상품</span>':"";
  const m=c.money;
  const compHtml=p=>'<div class="comp">'+
    '<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+(p.star?'<span class="star">⭐</span> ':'')+esc(p.name||'(이름없음)')+'</a><br>'+
    '한 달 <span class="rev">'+W(p.revenue)+'원</span> 벌음 — '+p.sales.toLocaleString()+'개 × '+
    p.price.toLocaleString()+'원 ('+(p.reviews==null?'리뷰수 확인 못함':
      '리뷰 '+p.reviews.toLocaleString()+'개')+')</div>';
  const compAll=c.competitors||[];
  const comps=compAll.slice(0,2).map(compHtml).join("");
  const compRestArr=compAll.slice(2);
  const compMore=compRestArr.length?
    '<div class="compRest">'+compRestArr.map(compHtml).join("")+'</div>'+
    '<button class="more" data-act="more" data-n="'+compRestArr.length+'">+'+compRestArr.length+'개 더 보기</button>':"";
  const cn=(c.cn_terms||[]).map(t=>'<span data-act="copy" data-t="'+esc(t)+'">'+esc(t)+'</span>').join("");
  const isDone=done.has(c.keyword);
  const link=prog?'<div class="linkbox"><div class="sec">1688 링크 붙여넣기 → 엔터</div>'+
    '<input placeholder="https://detail.1688.com/..."></div>':"";
  // 우리가 들어갈 자리인가 — 없으면 통째로 생략한다 (빈 제목만 뜨는 게 최악)
  const en=(c.edge&&c.edge.notes)||[];
  const edge=en.length?'<div class="sec">🎯 우리가 들어갈 자리인가</div><div class="edge">'+
    en.map(n=>'<div class="'+(n[0]==="good"?"g":"w")+'"><b>'+
      (n[0]==="good"?"✓":"⚠")+'</b><span>'+esc(n[1])+'</span></div>').join("")+
    '</div>':"";
  const srch=(c.search_volume||0)>0?
    '<div>네이버에서 한 달 <em>'+c.search_volume.toLocaleString()+'번</em> 검색되는 말</div>':"";
  const undoBar=prog?"":'<div class="undoBar"><button data-act="undo">↩️ 되돌리기 — 다시 판단하기</button></div>';
  return '<div class="card '+(isDone?'done':'')+'" data-kw="'+esc(c.keyword)+'">'+
  '<div class="cardBody">'+
  '<div class="kw">'+esc(c.keyword)+'</div>'+
  '<div class="badges">'+sea+dead+'</div>'+
  (c.pitch?'<div class="hook">'+esc(c.pitch)+'</div>':'')+
  '<div class="big">한 달에 약 <em>'+W(m.revenue_28d)+'원</em>어치 팔리는 판</div>'+
  '<div class="facts">'+
    '<div>월 100개 넘게 파는 상품이 <em>'+m.sellers+'개</em></div>'+
    // 🔴 분모는 "리뷰를 확인한 상품 수"다. 못 믿는 값은 뺐으므로 위의 총 개수와
    //    다를 수 있다 — 그 차이를 숨기면 8개 중 1개가 20% 로 보인다.
    '<div>'+(c.newbie.unknown?'리뷰를 확인한 <em>'+c.newbie.known+'개</em> 중 ':'그중 ')+
      '<em>'+c.newbie.count+'개</em>는 리뷰 100개도 안 되는 새 상품 ('+c.newbie.pct+'%)'+
      (c.newbie.pct>=40?' <span class="why">→ 새로 들어가도 팔린다는 뜻</span>':'')+
      (c.newbie.unknown?'<br><span class="why">나머지 '+c.newbie.unknown+
        '개는 리뷰수를 확인 못 했다</span>':'')+'</div>'+
    '<div>주로 <em>'+m.price_p50.toLocaleString()+'원</em> 안팎에 팔림 (비싼 축은 '+m.price_p75.toLocaleString()+'원)</div>'+
    (m.band_sellers>0?
      '<div>1.5~3만원대에서도 <em>'+m.band_sellers+'개 상품</em>이 월 <em>'+m.band_units.toLocaleString()+'개</em> 팔림</div>':
      '<div>1.5~3만원대에는 아직 파는 상품이 없음</div>')+
    srch+
  '</div>'+
  edge+
  '<div class="sec">💰 여기서 돈 버는 상품들 (⭐ = 리뷰 거의 없는데 잘 팔림)</div>'+comps+compMore+
  '<div class="sec">🔎 1688에서 이렇게 검색 (누르면 복사됨)</div><div class="cn">'+cn+'</div>'+
  link+
  (prog?"":'<div class="acts">'+
    '<button class="o" data-act="O">O 들어간다</button>'+
    '<button class="x" data-act="x">X</button>'+
    '<button class="h" data-act="hold">보류</button></div>'+
  '<div class="reasons">'+
    ["부피큼","마진안남","경쟁셈","맘에안듦","규제","기타"].map(r=>
      '<button data-act="reason" data-r="'+r+'">'+r+'</button>').join("")+
    '<input class="memo" placeholder="한 줄 메모 (선택)">'+
  '</div>')+
  '</div>'+
  undoBar+
  '</div>'}
function passFilter(c){
  const notes=(c.edge&&c.edge.notes)||[];
  if(FILTER==="clean")return notes.length===0;
  if(FILTER==="good")return notes.some(n=>n[0]==="good");
  return true}
function computeFiltered(){
  let cs;
  if(TAB==="prog"){cs=DATA.progress.slice()}
  else{
    cs=DATA.cards.filter(c=>{
      const s=c.season&&c.season!=="연중"&&c.season!=="?"&&c.ratio>=2;
      return TAB==="season"?s:!s});
    if(TAB==="season")cs.sort((a,b)=>(a.deadline||"9")<(b.deadline||"9")?-1:1)}
  if(Q)cs=cs.filter(c=>c.keyword.toLowerCase().includes(Q));
  cs=cs.filter(passFilter);
  return cs}
function ensureObserver(){
  if(observer)return;
  observer=new IntersectionObserver(es=>{if(es[0].isIntersecting)appendMore()},
    {rootMargin:"600px"})}
function appendMore(){
  const el=document.getElementById("list");
  if(sentinel){if(observer)observer.unobserve(sentinel);sentinel.remove();sentinel=null}
  const next=filteredList.slice(shown,shown+PAGE);
  if(next.length){
    const tmp=document.createElement("div");
    tmp.innerHTML=next.map(c=>card(c,TAB==="prog")).join("");
    while(tmp.firstChild)el.appendChild(tmp.firstChild);
    shown+=next.length}
  if(shown<filteredList.length){
    ensureObserver();
    sentinel=document.createElement("div");
    sentinel.style.height="1px";
    el.appendChild(sentinel);
    observer.observe(sentinel)}}
function render(){
  const el=document.getElementById("list");
  if(!K){el.innerHTML='<div class="empty">접근 토큰이 없다 (?k=)</div>';return}
  if(!DATA){el.innerHTML='<div class="empty">불러오는 중…</div>';return}
  filteredList=computeFiltered();shown=0;
  if(sentinel){if(observer)observer.unobserve(sentinel);sentinel.remove();sentinel=null}
  el.innerHTML="";
  if(!filteredList.length){el.innerHTML='<div class="empty">카드가 없다</div>';return}
  appendMore()}
document.getElementById("list").addEventListener("click",onAct);
document.getElementById("list").addEventListener("keydown",onKey);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");TAB=t.dataset.t;render()});
document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  ch.classList.add("on");FILTER=ch.dataset.f;render()});
document.getElementById("search").addEventListener("input",ev=>{
  Q=ev.target.value.trim().toLowerCase();render()});
// IntersectionObserver 가 안 발화하는 브라우저 대비 폴백 — 스크롤 위치로도 이어붙인다
let scrollTick=false;
window.addEventListener("scroll",()=>{
  if(scrollTick)return;scrollTick=true;
  setTimeout(()=>{scrollTick=false;
    if(filteredList.length>shown&&
       window.innerHeight+window.scrollY>=document.body.scrollHeight-800)appendMore()},150)},
  {passive:true});
render();
if(K)fetch(API).then(r=>r.json()).then(d=>{DATA=d;updateMeta();render()})
  .catch(()=>{document.getElementById("list").innerHTML=
    '<div class="empty">불러오기 실패 — 토큰 확인</div>'});
</script></body></html>
