<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>소싱 인박스</title>
<!--
  껍데기 페이지다. 데이터도 키도 없다.
  카드·저장은 전부 ?k= 토큰이 붙은 API 가 한다. 토큰 없이 열면 빈 화면이다.
-->
<style>
:root{--bg:#0f1115;--card:#1a1e26;--line:#2a2f3a;--tx:#e8eaf0;--dim:#8b93a5;
--go:#34c98e;--no:#e05666;--hold:#d9a441;--chip:#242a35}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Malgun Gothic',sans-serif;padding-bottom:40px}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;z-index:5}
h1{font-size:17px}#meta{color:var(--dim);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;background:var(--chip);color:var(--dim);font-size:14px;border:1px solid var(--line)}
.tab.on{background:#2b3446;color:var(--tx);border-color:#3d4a63}
main{padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.kw{font-size:19px;font-weight:800}
.badges{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.b{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--chip);color:var(--dim)}
.b.season{background:#3d3320;color:#e8c15a}
.b.dday{background:#46232a;color:#ff8f9d}
.hook{color:#e8c15a;font-size:14.5px;font-weight:700;margin-bottom:8px;line-height:1.5}
.big{font-size:21px;font-weight:800;margin:4px 0 10px}
.big em{color:var(--go);font-style:normal}
.facts{font-size:14.5px;line-height:1.8;color:#c8d0e0}
.facts em{color:var(--tx);font-weight:700;font-style:normal}
.facts .why{color:#8fd8b8}
.sec{font-size:12.5px;color:var(--dim);margin:14px 0 6px;letter-spacing:.04em}
.comp{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.edge{margin-top:6px;font-size:14px;line-height:1.65}
.edge div{padding:7px 10px;border-radius:9px;margin-bottom:5px;display:flex;gap:7px}
.edge .g{background:#16302a;color:#9fe3c4}
.edge .w{background:#332126;color:#f0a9b4}
.edge b{flex:0 0 auto}
.comp a{color:#7fb2ff;text-decoration:none}
.comp .rev{color:var(--go);font-weight:700}
.star{color:#e8c15a}
.cn{display:flex;gap:6px;flex-wrap:wrap}
.cn span{background:var(--chip);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:14px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;padding:13px 0;border-radius:11px;border:0;font-size:16px;font-weight:700;color:#fff}
.o{background:var(--go)}.x{background:var(--no)}.h{background:var(--hold)}
.reasons{display:none;gap:6px;flex-wrap:wrap;margin-top:10px}
.reasons.show{display:flex}
.reasons button{background:var(--chip);border:1px solid var(--line);color:var(--tx);padding:8px 12px;border-radius:9px;font-size:13px}
.memo{width:100%;margin-top:8px;background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:9px;font-size:14px}
.linkbox{margin-top:10px}
.linkbox input{width:100%;background:var(--chip);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:10px;font-size:13px}
.done{opacity:.35;pointer-events:none}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b3446;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style></head><body>
<header><h1>소싱 인박스</h1><div id="meta"></div>
<div class="tabs">
<div class="tab on" data-t="year">연중</div>
<div class="tab" data-t="season">시즌</div>
<div class="tab" data-t="prog">진행중</div>
</div></header>
<main id="list"></main>
<div class="toast" id="toast"></div>
<script>
const K=new URLSearchParams(location.search).get("k")||"";
const API="https://pgftsnnvnthpvwuicxpv.supabase.co/functions/v1/kanpick-inbox?k="+encodeURIComponent(K);
const done=new Set(JSON.parse(localStorage.getItem("kanpick_done")||"[]"));
let DATA=null, TAB="year";
const W=n=>n>=1e8?(n/1e8).toFixed(1)+"억":n>=1e4?Math.round(n/1e4)+"만":n.toLocaleString();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function post(row){
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(row)});
    if(!r.ok)throw 0;return true}
  catch(e){toast("전송 실패 — 나중에 다시");return false}}
function toast(m){const t=document.getElementById("toast");t.textContent=m;
  t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}
function copy(s){navigator.clipboard&&navigator.clipboard.writeText(s);toast("복사됨 "+s)}
function decide(kw,d,reason,memo,link){
  post({keyword:kw,decision:d,reason:reason||"",memo:memo||"",link_1688:link||""});
  done.add(kw);localStorage.setItem("kanpick_done",JSON.stringify([...done]));
  const el=document.querySelector('[data-kw="'+CSS.escape(kw)+'"]');
  if(el)el.classList.add("done");
  toast(d==="O"?"O — 들어간다":d==="X"?"X — 버림":"보류")}
function onAct(ev){
  const b=ev.target.closest("[data-act]");if(!b)return;
  const card=b.closest(".card"),kw=card.dataset.kw,act=b.dataset.act;
  if(act==="O")decide(kw,"O");
  else if(act==="hold")decide(kw,"hold");
  else if(act==="x")card.querySelector(".reasons").classList.toggle("show");
  else if(act==="reason")decide(kw,"X",b.dataset.r,card.querySelector(".memo").value);
  else if(act==="copy")copy(b.dataset.t)}
function onKey(ev){
  if(ev.key!=="Enter")return;
  const i=ev.target.closest(".linkbox input");if(!i||!i.value)return;
  decide(i.closest(".card").dataset.kw,"O","","link",i.value);i.value=""}
function card(c,prog){
  const dead=c.deadline?'<span class="b dday">⏰ '+esc(c.deadline)+' 까지 발주해야 시즌을 잡음</span>':"";
  const sea=(c.season&&c.season!=="연중"&&c.season!=="?")?
    '<span class="b season">'+c.peak_month+'월에 '+Math.round(c.ratio)+'배로 뛰는 '+esc(c.season)+' 상품</span>':"";
  const m=c.money;
  const comps=(c.competitors||[]).map(p=>'<div class="comp">'+
    '<a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+(p.star?'<span class="star">⭐</span> ':'')+esc(p.name||'(이름없음)')+'</a><br>'+
    '한 달 <span class="rev">'+W(p.revenue)+'원</span> 벌음 — '+p.sales.toLocaleString()+'개 × '+
    p.price.toLocaleString()+'원 (리뷰 '+p.reviews.toLocaleString()+'개)</div>').join("");
  const cn=(c.cn_terms||[]).map(t=>'<span data-act="copy" data-t="'+esc(t)+'">'+esc(t)+'</span>').join("");
  const isDone=done.has(c.keyword);
  const link=prog?'<div class="linkbox"><div class="sec">1688 링크 붙여넣기 → 엔터</div>'+
    '<input placeholder="https://detail.1688.com/..."></div>':"";
  // 우리가 들어갈 자리인가 — 없으면 통째로 생략한다 (빈 제목만 뜨는 게 최악)
  const en=(c.edge&&c.edge.notes)||[];
  const edge=en.length?'<div class="sec">🎯 우리가 들어갈 자리인가</div><div class="edge">'+
    en.map(n=>'<div class="'+(n[0]==="good"?"g":"w")+'"><b>'+
      (n[0]==="good"?"✓":"⚠")+'</b><span>'+esc(n[1])+'</span></div>').join("")+
    '</div>':"";
  const srch=(c.search_volume||0)>0?
    '<div>네이버에서 한 달 <em>'+c.search_volume.toLocaleString()+'번</em> 검색되는 말</div>':"";
  return '<div class="card '+(isDone?'done':'')+'" data-kw="'+esc(c.keyword)+'">'+
  '<div class="kw">'+esc(c.keyword)+'</div>'+
  '<div class="badges">'+sea+dead+'</div>'+
  (c.pitch?'<div class="hook">'+esc(c.pitch)+'</div>':'')+
  '<div class="big">한 달에 약 <em>'+W(m.revenue_28d)+'원</em>어치 팔리는 판</div>'+
  '<div class="facts">'+
    '<div>월 100개 넘게 파는 상품이 <em>'+m.sellers+'개</em></div>'+
    '<div>그중 <em>'+c.newbie.count+'개</em>는 리뷰 100개도 안 되는 새 상품 ('+c.newbie.pct+'%)'+
      (c.newbie.pct>=40?' <span class="why">→ 새로 들어가도 팔린다는 뜻</span>':'')+'</div>'+
    '<div>주로 <em>'+m.price_p50.toLocaleString()+'원</em> 안팎에 팔림 (비싼 축은 '+m.price_p75.toLocaleString()+'원)</div>'+
    (m.band_sellers>0?
      '<div>1.5~3만원대에서도 <em>'+m.band_sellers+'개 상품</em>이 월 <em>'+m.band_units.toLocaleString()+'개</em> 팔림</div>':
      '<div>1.5~3만원대에는 아직 파는 상품이 없음</div>')+
    srch+
  '</div>'+
  edge+
  '<div class="sec">💰 여기서 돈 버는 상품들 (⭐ = 리뷰 거의 없는데 잘 팔림)</div>'+comps+
  '<div class="sec">🔎 1688에서 이렇게 검색 (누르면 복사됨)</div><div class="cn">'+cn+'</div>'+
  link+
  (prog?"":'<div class="acts">'+
    '<button class="o" data-act="O">O 들어간다</button>'+
    '<button class="x" data-act="x">X</button>'+
    '<button class="h" data-act="hold">보류</button></div>'+
  '<div class="reasons">'+
    ["부피큼","마진안남","경쟁셈","맘에안듦","규제","기타"].map(r=>
      '<button data-act="reason" data-r="'+r+'">'+r+'</button>').join("")+
    '<input class="memo" placeholder="한 줄 메모 (선택)">'+
  '</div>')+
  '</div>'}
function render(){
  const el=document.getElementById("list");
  if(!K){el.innerHTML='<div class="empty">접근 토큰이 없다 (?k=)</div>';return}
  if(!DATA){el.innerHTML='<div class="empty">불러오는 중…</div>';return}
  let rows;
  if(TAB==="prog"){rows=DATA.progress.map(c=>card(c,true))}
  else{
    let cs=DATA.cards.filter(c=>{
      const s=c.season&&c.season!=="연중"&&c.season!=="?"&&c.ratio>=2;
      return TAB==="season"?s:!s});
    if(TAB==="season")cs.sort((a,b)=>(a.deadline||"9")<(b.deadline||"9")?-1:1);
    rows=cs.map(c=>card(c,false))}
  el.innerHTML=rows.length?rows.join(""):'<div class="empty">카드가 없다</div>'}
document.getElementById("list").addEventListener("click",onAct);
document.getElementById("list").addEventListener("keydown",onKey);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");TAB=t.dataset.t;render()});
render();
if(K)fetch(API).then(r=>r.json()).then(d=>{DATA=d;
  document.getElementById("meta").textContent=
    d.published_at+" 발행 · 새 카드 "+d.cards.length+" · 진행중 "+d.progress.length;
  render()}).catch(()=>{document.getElementById("list").innerHTML=
    '<div class="empty">불러오기 실패 — 토큰 확인</div>'});
</script></body></html>
