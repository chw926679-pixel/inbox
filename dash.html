<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>칸픽 소싱 대시보드</title>
<!--
  껍데기 페이지다. 데이터도 키도 없다.
  카드·판정 저장은 전부 ?k= 토큰이 붙은 API 가 한다. 토큰 없이 열면 빈 화면이다.
  데스크톱 /dash 는 15컬럼 가로 테이블이라 폰에서 못 본다 — 같은 데이터를 카드로 그린다.
-->
<style>
:root{--bg:#0f1115;--card:#1a1e26;--line:#2a2f3a;--tx:#e8eaf0;--dim:#8b93a5;
--chip:#242a35;--go:#34c98e;--hold:#d9a441;--no:#e05666;--link:#7fb2ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);
font:15px/1.55 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,sans-serif;
font-variant-numeric:tabular-nums;padding-bottom:48px}
a{color:var(--link)}
header,main{max-width:760px;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
padding:12px 14px 10px;z-index:5}
h1{font-size:16px;letter-spacing:-.01em}
#meta{color:var(--dim);font-size:11.5px;margin-top:3px}
.controls{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;
scrollbar-width:none}
.controls::-webkit-scrollbar{display:none}
.controls button{flex:0 0 auto;background:var(--chip);color:var(--dim);
border:1px solid var(--line);border-radius:20px;padding:7px 13px;font:inherit;
font-size:13px;cursor:pointer}
.controls button[aria-pressed=true]{background:#2b3446;color:var(--tx);border-color:#3d4a63}
.controls button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
#q{width:100%;margin-top:8px;background:var(--chip);border:1px solid var(--line);
color:var(--tx);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px}
#q::placeholder{color:var(--dim)}
#q:focus-visible{outline:2px solid var(--link);outline-offset:1px}
#count{color:var(--dim);font-size:11.5px;padding:4px 2px 0}
main{padding:12px 12px 0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.gone{opacity:.3;pointer-events:none}
.top{display:flex;align-items:center;gap:8px}
.vd{font-size:19px;font-weight:800;line-height:1}
.vd.v1{color:var(--go)}.vd.v2{color:var(--hold)}.vd.v3{color:var(--dim)}
.score{font-size:19px;font-weight:800}
.gsum{margin-left:auto;font-size:11.5px;padding:3px 9px;border-radius:20px;
background:var(--chip);color:var(--dim)}
.gsum.g3{background:#17342a;color:var(--go)}
.gsum.g2{background:#3a3020;color:var(--hold)}
.gsum.g1{background:#3d2126;color:var(--no)}
.new{font-size:10.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;
border-radius:5px;background:var(--go);color:#08130e}
.card.isnew{border-color:#2d6b52}
h2{margin:9px 0 2px;font-size:15px;font-weight:600;line-height:1.4;text-wrap:balance}
h2 a{text-decoration:none}
.qty{color:var(--no);font-style:normal;font-weight:700;font-size:12.5px}
.kw{color:var(--dim);font-size:12px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding:11px 0;
border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lbl{display:block;color:var(--dim);font-size:11px;letter-spacing:.03em}
.hero b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.hero i{font-style:normal;font-size:13px;font-weight:600;margin-left:1px}
.hero .sub{display:block;color:var(--dim);font-size:11px;margin-top:1px}
.sub em{font-style:normal;padding:1px 5px;border-radius:4px;margin-left:2px}
.s1{background:#17342a;color:var(--go)}
.s2{background:#3a3020;color:var(--hold)}
.s3{background:#3d2126;color:var(--no)}
.gates{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.g{font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--chip);
color:var(--dim);border:1px solid var(--line)}
.g b{font-weight:700}
.g.on{background:#17342a;color:var(--go);border-color:#245c47}
.g.off{background:#3d2126;color:var(--no);border-color:#5e2f36}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 10px;margin-top:12px}
.stats>div{display:flex;flex-direction:column}
dt{color:var(--dim);font-size:11px}
dd{margin:0;font-size:14px;font-weight:600}
dd.big{font-size:17px;font-weight:800;color:var(--go)}
.links{display:flex;gap:8px;margin-top:13px}
.lnk{flex:1;text-align:center;padding:10px 0;border-radius:9px;text-decoration:none;
font-size:13.5px;font-weight:700}
.cp{background:#2b3446;color:var(--tx)}
.cn{background:var(--chip);color:var(--link);border:1px solid var(--line)}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{flex:1;padding:11px 0;border-radius:9px;border:0;font:inherit;
font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.bo{background:var(--go);color:#08130e!important;flex:1.4}
.bx{background:var(--no);flex:.6}.bh{background:var(--hold)}
.lnk:focus-visible,.acts button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.reasons{display:none;gap:6px;flex-wrap:wrap;margin-top:8px}
.reasons.show{display:flex}
.reasons button{background:var(--chip);border:1px solid var(--line);color:var(--tx);
padding:8px 12px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.xreason{flex:1 1 100%;background:var(--chip);border:1px solid var(--line);
color:var(--tx);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px}
.xreason:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.empty{color:var(--dim);text-align:center;padding:44px 0;font-size:14px}
#alerts{display:none;margin-top:8px;padding:9px 12px;border-radius:9px;
background:#3d2126;border:1px solid #5e2f36;color:#ff8f9d;font-size:12.5px;
line-height:1.6}
#alerts.show{display:block}
/* 🔴 계산기는 띄운 채로 카드를 스크롤한다 (2026-08-17 대표 요청).
   페이지 안에 박아뒀더니 값 넣으러 위로, 카드 보러 아래로 왕복해야 했다.
   좁은 창(반쪽 화면)에서 쓰는 게 기본이라 폭 340px 고정 + 화면 안 스크롤. */
#calcwrap{display:none;position:fixed;right:12px;bottom:12px;width:340px;
max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);z-index:30;
overflow:auto;overscroll-behavior:contain;
box-shadow:0 12px 40px rgba(0,0,0,.6);border-radius:14px}
#calcwrap.show{display:block}
#calcwrap .card{border-color:#3d4a63}
/* 🔴 반쪽 창(왼쪽 대시보드 · 오른쪽 1688)이 기본 작업 자세다.
   창이 1120px 이상이면 카드를 왼쪽으로 밀어 계산기와 안 겹치게 하고,
   그보다 좁으면 폰처럼 아래에서 올라오는 시트로 바꾼다. */
@media (max-width:879px){          /* 폰·좁은 창 — 아래에서 올라오는 시트 */
  #calcwrap{right:0;bottom:0;left:0;width:auto;max-width:none;
  max-height:80vh;border-radius:16px 16px 0 0}
  #calcwrap .card{border-radius:16px 16px 0 0}
}
/* 880px 이상 — 계산기를 오른쪽에 세우고 카드를 그만큼 왼쪽으로 좁힌다.
   반쪽 창(≈1000px)에서 카드 620px + 계산기 340px 이 나란히 선다. */
@media (min-width:880px){
  body.calcon header,body.calcon main{margin-left:0;margin-right:376px;
  max-width:none}
  #calcbd{display:none!important}                       /* 카드를 안 가린다 */
}
#calcbd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}
#calcbd.show{display:block}
.chead{display:flex;align-items:center;gap:8px}
.chead b{font-size:14px}
#calcfor{color:var(--dim);font-size:11px;margin-top:2px;line-height:1.4;
overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical}
#calcx{margin-left:auto;background:var(--chip);border:1px solid var(--line);
color:var(--dim);border-radius:8px;width:30px;height:30px;font:inherit;
font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cgrid label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
.cgrid input{width:100%;background:var(--chip);border:1px solid var(--line);
color:var(--tx);border-radius:8px;padding:7px 8px;font:inherit;font-size:15px}
/* 카드에서 계산기로 값을 넘기는 버튼 */
.calcbtn{background:var(--chip);color:var(--link);border:1px solid var(--line);
border-radius:9px;padding:11px 0;font:inherit;font-size:13.5px;font-weight:700;
cursor:pointer;flex:0 0 84px}
.calcbtn:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.cgrid input:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.cout{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.cbig{display:flex;align-items:baseline;gap:10px}
.cbig b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.cbig .pct{font-size:16px;font-weight:700}
.ok{color:var(--go)}.ng{color:var(--no)}
.crows{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 10px;margin-top:10px}
.crows>div{display:flex;justify-content:space-between;font-size:13px}
.crows dt{color:var(--dim);font-weight:400}
.crows dd{margin:0;font-weight:700}
#calcnote{color:var(--dim);font-size:11px;margin-top:9px;line-height:1.5}
#calcfail{display:none;margin-top:9px;padding:8px 11px;border-radius:8px;
background:#3d2126;border:1px solid #5e2f36;color:#ff8f9d;font-size:12px}
#calcfail.show{display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b3446;
padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;
pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
<h1>칸픽 소싱 대시보드</h1>
<div id="meta">불러오는 중…</div>
<div id="alerts"></div>
<div class="controls" role="group" aria-label="판정 필터">
<button data-f="vd" data-v="◎" aria-pressed="true">◎ 최우선</button>
<button data-f="vd" data-v="◎○" aria-pressed="false">◎ ○</button>
<button data-f="vd" data-v="" aria-pressed="false">전체</button>
<button data-f="gate" data-v="3" aria-pressed="false">게이트 3/3</button>
<button data-f="onlynew" data-v="1" aria-pressed="false" id="btnNew">새 후보</button>
<button data-f="picks" data-v="1" aria-pressed="false" id="btnPicks">✅ 통과</button>
<button id="btnCalc" aria-pressed="false">🧮 계산기</button>
</div>
<div class="controls" role="group" aria-label="정렬">
<button data-f="sort" data-v="score" aria-pressed="true">점수순</button>
<button data-f="sort" data-v="profit" aria-pressed="false">월 공헌순</button>
<button data-f="sort" data-v="ratio" aria-pressed="false">공헌율순</button>
</div>
<input id="q" placeholder="상품·키워드 검색" autocomplete="off">
<div id="count"></div>
</header>
<div id="calcbd"></div>
<section id="calcwrap" role="dialog" aria-label="판정 계산기"><div class="card">
 <div class="chead"><b>판정 계산기</b>
  <span class="gsum" id="calctier">—</span>
  <button id="calcx" aria-label="계산기 닫기">×</button></div>
 <div id="calcfor"></div>
 <div id="calcfail"></div>
 <div class="cgrid">
  <label>판매가 원<input id="ci_sell" type="number" inputmode="numeric" value="19900"></label>
  <label>1688 ¥<input id="ci_cny" type="number" inputmode="decimal" step="0.1" value="10"></label>
  <label>수량 개<input id="ci_qty" type="number" inputmode="numeric" value="200"></label>
  <label>가로 cm<input id="ci_w" type="number" inputmode="decimal" value="30"></label>
  <label>세로 cm<input id="ci_d" type="number" inputmode="decimal" value="20"></label>
  <label>높이 cm<input id="ci_h" type="number" inputmode="decimal" value="5"></label>
  <label>무게 g<input id="ci_g" type="number" inputmode="numeric" value="400"></label>
  <label>수수료 %<input id="ci_comm" type="number" inputmode="decimal" step="0.1" value="10.8"></label>
  <label>N개입<input id="ci_set" type="number" inputmode="numeric" value="1"></label>
 </div>
 <button id="calcsave" class="calcbtn" style="display:none;width:100%;margin-top:9px"
  onclick="calcSave()">📐 이 상품에 실가·포장 저장</button>
 <div class="cout">
  <div class="cbig"><span class="lbl">개당 공헌</span>
   <b id="co_contrib">—</b><span class="pct" id="co_ratio"></span></div>
  <div class="gates" id="co_gates"></div>
  <dl class="crows">
   <div><dt>개당 원가</dt><dd id="co_up">—</dd></div>
   <div><dt>원가율</dt><dd id="co_costr">—</dd></div>
   <div><dt>손익분기가</dt><dd id="co_be">—</dd></div>
   <div><dt>목표판매가</dt><dd id="co_min">—</dd></div>
   <div><dt>최대 사입가</dt><dd id="co_max">—</dd></div>
   <div><dt>무게값어치</dt><dd id="co_wv">—</dd></div>
  </dl>
  <p id="calcnote"></p>
 </div>
</div></section>

<main id="list"></main>
<div class="toast" id="toast"></div>
<script>
const K = new URLSearchParams(location.search).get("k") || "";
const API = "https://pgftsnnvnthpvwuicxpv.supabase.co/functions/v1/kanpick-dash?k="
          + encodeURIComponent(K);
let DATA = null;
const state = {vd:"◎", gate:0, sort:"score", q:"", onlynew:0, picks:0};
// 폰에서 치운 것은 즉시 사라지게 (회수 전까지 로컬로 기억)
const gone = new Set(JSON.parse(localStorage.getItem("kanpick_dash_gone") || "[]"));

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => {
  n = Math.round(n || 0);
  if (Math.abs(n) >= 1e8) return (n/1e8).toFixed(1) + "억";
  if (Math.abs(n) >= 1e4) return Math.round(n/1e4).toLocaleString() + "만";
  return n.toLocaleString();
};
function toast(m){const t=document.getElementById("toast");t.textContent=m;
  t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}

// 🔴 상품명을 onclick 인자로 넘기지 않는다 — JSON.stringify 의 큰따옴표가
//    onclick="..." 속성을 끊어서 판정이 조용히 안 걸렸다 (2026-08-14).
//    이름은 카드 DOM 에서 읽는다.
// 🔴 전송이 실패하면 카드를 되살린다 (2026-08-17).
//    전에는 응답을 안 보고 카드부터 숨겨서, 실패한 판정이 조용히 사라졌다
//    — 그 상품은 화면에서도 없고 서버에도 없는 상태가 된다.
async function decide(pid, d, reason){
  const el = document.getElementById("c_" + pid);
  const name = el ? (el.querySelector("h2 a")||{}).textContent || "" : "";
  if (el) el.classList.add("gone");
  gone.add(pid);
  localStorage.setItem("kanpick_dash_gone", JSON.stringify([...gone]));
  toast(d === "X" ? "치웠다" : d === "O" ? "✅ 통과 — 소싱 대상에 넣는다" : "보류");
  let ok = false;
  try{
    const r = await fetch(API, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({product_id:pid, name, decision:d, reason:reason||""})});
    ok = r.ok;
  }catch(e){ ok = false; }
  if (!ok){
    gone.delete(pid);
    localStorage.setItem("kanpick_dash_gone", JSON.stringify([...gone]));
    if (el) el.classList.remove("gone");
    toast("⚠ 저장 안 됐다 — 다시 눌러라");
  }
}

// ── 판정 계산기 ──────────────────────────────────────────
// 🔴 engine/cost.py 트리오링크 경로의 **사본**이다 (손계산 금지 규칙의 예외).
//    상수는 전부 dash.json 의 calc.params 로 주입되고, calc.refs(엔진이 직접
//    계산한 기준 케이스)를 로드 시 재계산해 어긋나면 스스로 잠근다.
//    엔진 공식을 고치면 여기도 같이 고쳐야 한다 — 어긋나면 배너가 뜬다.
const bankRound = x => {                 // 파이썬 round() = 반올림 반내림 짝수
  const f = Math.floor(x);
  return (x - f === .5) ? (f % 2 === 0 ? f : f + 1) : Math.round(x);
};
function engineCalc(P, i){
  const M = Math, q = i.qty, comm = i.comm != null ? i.comm : P.comm_default;
  const wkg = i.g / 1000;
  const vol = i.w * i.d * i.h / P.vol_div * P.vol_disc;    // 해상 부피무게 ×0.6
  const bkg = M.max(wkg, vol), cbm = i.w * i.d * i.h / 1e6;
  const sum = i.w + i.d + i.h;
  const fx = P.fx_measured * (1 + P.fx_buffer);
  const goodsCny = i.cny * q;
  // 중국내운임 — 包邮 임계 미만이면 택배/화물 중 싼 쪽 (엔진 기본 경로)
  let cnC = 0;
  if (goodsCny < P.cn.free_thr && wkg * q > 0){
    const tk = wkg * q;
    const ex = P.cn.first + M.max(0, tk - 1) * P.cn.add;
    cnC = tk < P.cn.thr_kg ? ex : M.min(ex, M.max(P.cn.min, tk * P.cn.kg));
  }
  const goods = goodsCny * fx, cnf = cnC * fx, proc = goods + cnf;
  // 해상 — 트리오링크 LCL, 화물 최소 1CBM 가정 후 부피 비중 안분
  const skuCbm = cbm * q, shipCbm = M.max(1, skuCbm);
  const bill = M.max(1, M.ceil(shipCbm * 2) / 2);
  let lcl = P.trio.lcl_cbm + M.max(0, bill - 1) / 0.5 * P.trio.lcl_half
          + P.trio.cont_base;
  if (bill > 3) lcl += (bill - 3) / 0.5 * P.trio.cont_half;
  const sea = lcl * (skuCbm / shipCbm);
  // C/O — 관세 절감이 발급비보다 크면 발급 (단독 화물 기준)
  const dutyNo = goods * P.duty, co = dutyNo > P.trio.co;
  const duty = co ? 0 : dutyNo, coCost = co ? P.trio.co : 0;
  const customs = P.trio.customs + P.trio.bl;
  const labels = P.trio.label * q;
  const inspect = M.ceil(q / P.lot) * P.trio.inspect;
  const boxes = M.max(1, M.ceil(cbm * q / P.carton_cbm));
  const domestic = (P.trio.doc + P.trio.swap) * boxes;    // 직납 — 국내택배·FC 0
  const logistics = sea + coCost + customs + labels + inspect + domestic;
  const ivat = (goods + sea + duty) * P.vat;
  const landed = proc + logistics + duty + ivat;
  const up = landed / M.max(1, q * (1 - P.defect));        // 정상품으로 나눔
  // 쿠팡 — 사이즈 등급 (미실측 → SAFETY_UPLIFT)
  let t = P.tiers[P.tiers.length - 1];
  for (const x of P.tiers){ if (sum <= x[1] && wkg <= x[2]){ t = x; break; } }
  const inout = bankRound(t[3] * P.uplift), ship = bankRound(t[4] * P.uplift);
  const hard = sum > P.hardcut_cm || wkg > P.hardcut_kg;
  const commission = i.sell * comm;
  const storage = 0;                                       // 입고 30일 무료 구간
  const retUnit = q * P.return_rate > P.return_free ? t[5] : 0;
  const retCost = (retUnit + ship) * P.return_rate;
  const svat = i.sell * P.sales_vat;
  const exch = ship * P.exchange;
  const exitFee = M.max(0, q * P.disposal - P.exit_free) * P.exit_fee;
  const exitCost = (P.return_ship_box * M.max(1, boxes) * P.disposal + exitFee) / q;
  const cf = commission + inout + ship + storage + retCost + svat + exch + exitCost;
  const contrib = i.sell - cf - up;
  const ratio = i.sell ? contrib / i.sell : 0;
  const den = 1 - comm - P.sales_vat;
  // 판매가에 비례하지 않는 개당 비용은 전부 분자에 (cost.py 의 unit_fixed 와 같다).
  // svc·barcode 는 현재 정책에서 0 이라 항이 없다 (월고정비 제외 · 트리오링크 통합라벨).
  const unitFixed = up + inout + ship + storage + retCost + exch + exitCost;
  const be = M.ceil(unitFixed / den);
  const minP = M.ceil((unitFixed + P.target) / den);
  return {contrib, ratio, be, minP, up, tier: t[0], hard, boxes,
          wv: bkg ? i.sell / bkg : 0, freeShip: goodsCny >= P.cn.free_thr,
          co, costr: i.sell ? up / i.sell : 1};
}
function calcSelfTest(C){
  // 엔진이 계산해 실어 보낸 기준 케이스 3개를 그대로 재계산 — 어긋나면 잠근다
  const bad = [];
  for (const r of C.refs || []){
    const o = engineCalc(C.params, {cny:r.cny, sell:r.sell, w:r.w, d:r.d,
                                    h:r.h, g:r.g, qty:r.qty});
    if (Math.abs(o.contrib - r.contrib) > Math.max(20, r.sell * 0.005)
        || o.be !== r.breakeven)
      bad.push(`기준(¥${r.cny}/${r.sell}원): 폰 ${Math.round(o.contrib)} vs 엔진 ${Math.round(r.contrib)}`);
  }
  return bad;
}
let CALC_OK = false;
function calcRun(){
  const C = DATA && DATA.calc;
  const note = document.getElementById("calcnote");
  if (!C){ note.textContent = "계산기 데이터가 없다 — PC에서 dash_push 를 한 번 돌려라"; return; }
  const v = id => parseFloat(document.getElementById(id).value) || 0;
  const set = Math.max(1, v("ci_set"));
  const i = {sell: v("ci_sell"), cny: v("ci_cny") * set, qty: v("ci_qty") || 1,
             w: v("ci_w"), d: v("ci_d"), h: v("ci_h"), g: v("ci_g"),
             comm: v("ci_comm") / 100};
  if (!i.sell || !i.cny){ note.textContent = "판매가와 위안가를 넣어라"; return; }
  if (!(i.w && i.d && i.h && i.g)){
    // 규격 없이 계산하면 극소형으로 잘못 잡힌다 — 아예 안 계산한다
    ["co_contrib","co_ratio","co_up","co_costr","co_be","co_min","co_max","co_wv"]
      .forEach(id => { document.getElementById(id).textContent = "—"; });
    document.getElementById("co_gates").innerHTML = "";
    document.getElementById("calctier").textContent = "규격 대기";
    note.textContent = "가로·세로·높이·무게를 넣어라 — 1688 상세의 포장정보 표에서 "
      + "파는 옵션 것을 옮겨 적으면 된다";
    return;
  }
  const o = engineCalc(C.params, i);
  // 최대 사입가 — 게이트(공헌·공헌율)를 지키는 ¥ 상한 (calc_gui 와 같은 이분탐색)
  let lo = 0, hi = 1000;
  for (let k = 0; k < 40; k++){
    const mid = (lo + hi) / 2;
    const c2 = engineCalc(C.params, {...i, cny: mid});
    (c2.contrib >= C.params.gate.contrib && c2.ratio >= C.params.gate.ratio)
      ? lo = mid : hi = mid;
  }
  const G = C.params.gate, ok = (b) => b ? "ok" : "ng";
  const $ = id => document.getElementById(id);
  $("co_contrib").textContent = Math.round(o.contrib).toLocaleString() + "원";
  $("co_contrib").className = ok(o.contrib >= G.contrib);
  $("co_ratio").textContent = (o.ratio * 100).toFixed(1) + "%";
  $("co_ratio").className = "pct " + ok(o.ratio >= G.ratio);
  $("co_gates").innerHTML = [
    ["공헌 5천", o.contrib >= G.contrib],
    ["공헌율 35%", o.ratio >= G.ratio],
    ["무게값어치", o.wv >= G.wv],
    ["원가율 30%", o.costr <= 0.30],
  ].map(([n, b]) => `<span class="g ${b ? "on" : "off"}">${n}</span>`).join("");
  $("co_up").textContent = Math.round(o.up).toLocaleString() + "원";
  $("co_costr").textContent = (o.costr * 100).toFixed(0) + "%";
  $("co_be").textContent = o.be.toLocaleString() + "원";
  $("co_min").textContent = o.minP.toLocaleString() + "원";
  $("co_max").textContent = lo < 0.2 ? "없음"
    : "¥" + (lo / set).toFixed(1) + (set > 1 ? " /개" : "");
  $("co_wv").textContent = Math.round(o.wv).toLocaleString() + "원/kg";
  $("calctier").textContent = o.hard ? "⛔ 사이즈 초과 — 로켓그로스 불가"
    : `${o.tier} · ${o.boxes}박스`;
  note.textContent =
    (o.freeShip ? "包邮 가정(총액 ¥600+)" : "중국내운임 추정 포함")
    + ` · ${o.co ? "C/O 발급" : "관세 납부"} · 트리오링크 LCL·미실측 보정 1.5배`
    + (set > 1 ? ` · ${set}개입 세트(규격·무게는 세트 기준 입력)` : "")
    + " · 확정 판정은 PC 판정계산기";
}

let CALC_PID = null;                 // 지금 계산기에 올라와 있는 상품
function calcFrom(pid){
  const c = (DATA && DATA.items || []).find(x => x.pid === pid);
  if (!c) return;
  CALC_PID = pid;
  const set = Math.max(1, c.qty || 1);
  const put = (id, v) => { document.getElementById(id).value = v != null ? v : ""; };
  put("ci_sell", c.price);
  put("ci_set", set);
  put("ci_cny", c.r_cny != null ? +(+c.r_cny).toFixed(2) : null);
  // 🔴 규격·무게는 **비운다** (2026-08-18 실사고) — 이전 상품 값이 남은 채
  //    ¥만 고치고 저장하면 남의 규격이 따라 들어간다. 165g짜리 철제
  //    프린터선반이 그렇게 저장됐다. 1688 포장정보를 보고 직접 넣게 한다.
  ["ci_w", "ci_d", "ci_h", "ci_g"].forEach(id => put(id, null));
  const el = document.getElementById("calcfor");
  el.textContent = (c.name || "") + (c.n_off ? ` · 매칭 ${c.n_off}개 중앙값` : "");

}
// 🔴 대표가 계산기에서 고친 실가·포장을 **그 상품에 저장** (2026-08-17 대표 지시).
//    서버(dash_decisions, decision='spec')를 거쳐 dash_sync 가 manual_price ·
//    manual_spec 에 넣는다 — "사람 확인값은 어떤 자동값보다 위다" 경로 그대로.
//    화면도 즉시 반영한다: 이 카드의 공헌·게이트를 입력값으로 다시 계산해 다시 그린다.
async function calcSave(){
  if (!CALC_PID) return;
  const c = (DATA.items || []).find(x => x.pid === CALC_PID);
  if (!c) return;
  const v = id => parseFloat(document.getElementById(id).value) || 0;
  const s = {cny: v("ci_cny"), set: Math.max(1, v("ci_set")),
             w: v("ci_w"), d: v("ci_d"), h: v("ci_h"), g: v("ci_g")};
  if (!s.cny){ toast("¥ 를 넣어야 저장한다"); return; }
  let ok = false;
  try{
    const r = await fetch(API, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({product_id: CALC_PID, name: c.name || "",
        decision: "spec", reason: "", memo: JSON.stringify(s)})});
    ok = r.ok;
  }catch(e){ ok = false; }
  const btn = document.getElementById("calcsave");
  if (!ok){
    // 🔴 토스트는 1.6초면 사라진다 — 버튼에 상태를 못박는다 (2026-08-18 대표 피드백)
    btn.textContent = "⚠ 저장 실패 — 다시 누르기";
    btn.style.color = "#ff8f9d";
    toast("⚠ 저장 안 됐다");
    return;
  }
  btn.textContent = `✅ 저장됨 — ¥${s.cny}${s.set > 1 ? ` ×${s.set}개입` : ""} · ${s.w}×${s.d}×${s.h}cm ${s.g}g`;
  btn.style.color = "var(--go)";
  // 즉시 반영 — PC 재계산 전까지 폰 화면은 이 값으로 산다
  if (DATA.calc){
    const o = engineCalc(DATA.calc.params,
      {sell: c.price, cny: s.cny * s.set, qty: 200,
       w: s.w, d: s.d, h: s.h, g: s.g});
    c.r_cny = s.cny; c.r_contrib = Math.round(o.contrib);
    c.r_ratio = o.ratio; c.r_proc = Math.round(o.up);
    c.chk_min = s.cny; c.chk_max = s.cny; c.manual = 1;
  }
  toast("📐 저장됐다 — 이 값이 추정보다 우선한다");
  render();
}

//    팝업이 막히면 window.open 이 null 이라 — 그때는 그냥 새 탭으로 보낸다.
function refWin(a){
  // 폰이거나 화면 크기를 못 읽으면 크기 지정 없이 연다 (새 탭이 된다)
  const sw = screen.availWidth || 0, sh = screen.availHeight || 0;
  const feat = sw >= 900
    ? `width=${Math.round(sw/2)},height=${sh},left=${Math.round(sw/2)},top=0`
    : "";
  const win = window.open(a.href, "kanpick_ref", feat);
  if (!win) return true;                 // 차단됨 → 기본 동작(새 탭)에 맡긴다
  win.focus();
  return false;
}

}

function render(){
  const el = document.getElementById("list");
  if (!DATA) { el.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  if (state.picks) {
    el.innerHTML = picksView();
    document.getElementById("count").textContent =
      ((DATA.picks || []).length) + "개 통과";
    return;
  }
  let rows = DATA.items.filter(c => {
    if (state.vd && !state.vd.includes(c.verdict)) return false;
    if (state.onlynew && !(c.first_at &&
        c.first_at >= (DATA.new_since || DATA.today))) return false;
    if (state.q && !((c.name||"")+" "+(c.kw||"")).toLowerCase()
        .includes(state.q.toLowerCase())) return false;
    return true;
  });
  if (state.gate) {
    rows = rows.filter(c => {
      const price = c.price || 0, costr = price ? (c.r_proc||0)/price : 1;
      return (c.r_contrib||0) >= 5000 && (c.r_ratio||0) >= .35 && costr <= .30;
    });
  }
  const key = {score:"score", profit:"m_profit", ratio:"r_ratio"}[state.sort];
  rows = rows.slice().sort((a,b) => (b[key]||0) - (a[key]||0));
  el.innerHTML = rows.length ? rows.map(card).join("")
                             : '<div class="empty">조건에 맞는 후보가 없다</div>';
  document.getElementById("count").textContent = rows.length + "개";
}

document.querySelectorAll(".controls button").forEach(b => {
  b.addEventListener("click", () => {
    const f = b.dataset.f, v = b.dataset.v;
    if (f === "gate" || f === "onlynew" || f === "picks") {
      const on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", String(!on));
      if (f === "gate") state.gate = on ? 0 : 3;
      else if (f === "picks") state.picks = on ? 0 : 1;
      else state.onlynew = on ? 0 : 1;
    } else {
      state[f] = v;
      document.querySelectorAll(`[data-f="${f}"]`).forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.v === v)));
    }
    render();
  });
});
document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value.trim(); render();
});

async function load(){
  try{
    const r = await fetch(API + "&t=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    const a = DATA.asof || {};
    const n = DATA.new_count || 0;
    document.getElementById("meta").textContent =
      `수집 ${(DATA.scanned||0).toLocaleString()}개 → 후보 ${DATA.items.length}개`
      + (n ? ` · 새 후보 ${n}개` : "") + " · "
      + Object.entries(a).map(([k,v]) => k+" "+v).join(" · ")
      + ` · ${DATA.built_at} 기준`;
    const bn = document.getElementById("btnNew");
    if (bn) bn.textContent = n ? `새 후보 ${n}` : "새 후보";
    // 워치독 경고 — 시스템이 죽어 있으면 여기 뜬다
    const al = document.getElementById("alerts");
    if (al) {
      const list = DATA.alerts || [];
      al.classList.toggle("show", list.length > 0);
      al.innerHTML = list.map(a => "🔴 " + a).join("<br>");
    }
    calcInit();
    render();
  }catch(e){
    document.getElementById("meta").textContent = "불러오지 못했다 — 주소의 k 값 확인";
    document.getElementById("list").innerHTML =
      '<div class="empty">데이터를 못 받았다</div>';
  }
}
load();
// 폰을 다시 켜면 최신으로
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) load();
});
</script></body></html>
